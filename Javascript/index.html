<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Management System</h1>
    <button id="add-btn">Add Student</button>
    <button id="view-btn">View Students</button>
    <button id="sort-btn">Sort by Grade</button>
    <button id="delete-btn">Delete Student</button>
    <div id="student-list">
        <table id="student-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody id="student-tbody"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
